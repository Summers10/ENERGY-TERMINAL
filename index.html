<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Energy Fundamentals</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{height:100%}
body{
  font-family:'Courier New',Courier,monospace;font-size:17px;font-weight:500;min-height:100%;
  background:var(--bg);color:var(--text);font-variant-numeric:tabular-nums;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  transition:background .15s,color .15s;
}
body.dark{
  --bg:#000;--bg1:#060606;--bg2:#0a0a0a;--border:#141414;--border2:#1e1e1e;
  --text:#d4b896;--text2:#8a7a68;--text3:#6a5a4a;
  --amber:#f5a623;--green:#2e8f52;--red:#b83838;
  --th-bg:#040404;--section-bg:#050505;--row-alt:#030303;--row-latest:#0c0800;
}
body.light{
  --bg:#FFFFFF;--bg1:#F7F8FA;--bg2:#F0F1F4;--border:#E0E2E8;--border2:#C8CCD4;
  --text:#1A1D24;--text2:#3A3F4A;--text3:#6B7280;
  --amber:#B8720A;--green:#0E7A3A;--red:#C4302B;
  --th-bg:#F2F3F6;--section-bg:#ECEDF0;--row-alt:#F7F8FA;--row-latest:#FFF3DC;
}
#page-tabs{display:flex;align-items:center;border-bottom:2px solid #f5a623;background:#000}
.page-tab{flex:0 0 auto;padding:10px 22px;background:none;border:none;color:#6a5a4a;cursor:pointer;font-family:'Courier New',Courier,monospace;font-size:14px;font-weight:900;letter-spacing:.08em}
.page-tab.active{color:#f5a623}
.theme{margin-left:auto;margin-right:16px;display:flex;border:1px solid #1e1e1e;border-radius:3px;overflow:hidden}
.theme button{padding:7px 15px;background:none;border:none;color:#6a5a4a;cursor:pointer;font-family:inherit;font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.theme button.active{background:#f5a623;color:#000}
.topbar{padding:14px 20px;border-bottom:1px solid var(--amber);background:var(--bg);display:flex;align-items:center;gap:20px}
.topbar h1{font-size:18px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--amber);white-space:nowrap}
.meta{font-size:13px;color:var(--text3);letter-spacing:.04em;margin-left:auto;text-align:right}
.root{max-width:1300px;margin:0 auto;padding:22px}
.panel{border-bottom:2px solid var(--amber);margin-bottom:20px;overflow:hidden}
.panel-hdr{padding:9px 16px;background:var(--bg1);border:1px solid var(--border);border-bottom:none;border-top:3px solid var(--amber)}
.panel-title{font-size:16px;font-weight:900;letter-spacing:.09em;text-transform:uppercase;color:var(--amber)}
.panel-sub{font-size:13px;color:var(--text3);letter-spacing:.05em;margin-left:8px}
.tbl-wrap{overflow-x:auto}
.bal-table{width:100%;border-collapse:collapse;border:1px solid var(--border2);background:var(--bg)}
.bal-table th{background:var(--th-bg);padding:8px 8px;text-align:right;font-size:14px;font-weight:800;letter-spacing:.05em;color:var(--text2);border-bottom:2px solid var(--border2);white-space:nowrap}
.bal-table th:first-child{text-align:left;letter-spacing:.08em}
.bal-table th.latest{color:var(--amber);font-weight:900;border-bottom:2px solid var(--amber)}
.bal-table td{padding:5px 8px;text-align:right;font-size:15px;font-weight:600;border-bottom:1px solid var(--border);color:var(--text2);white-space:nowrap;background:var(--bg)}
.bal-table td:first-child{text-align:left;color:var(--text);font-weight:700;white-space:normal}
td.latest{color:var(--amber) !important;font-weight:800 !important}
td.prior{color:var(--text3)}
td.unit{color:var(--text3);text-align:left !important;font-size:13px !important}
td.stale{color:var(--red) !important;font-weight:800 !important}
.row-section td{background:var(--section-bg) !important;color:var(--amber) !important;font-size:12px !important;font-weight:900;letter-spacing:.12em;text-transform:uppercase;padding:6px 10px 5px;border-top:2px solid var(--border2);text-align:left !important}
.row-alt td{background:var(--row-alt) !important}
.row-sel td{background:var(--row-latest) !important}
.row-sel td:first-child{box-shadow:inset 3px 0 0 var(--amber)}
.bal-table tbody tr:hover td{background:var(--bg2)}
.chart-wrap{position:relative;border:1px solid var(--border2);border-top:none;background:var(--bg);padding:6px 4px 0}
#chart{width:100%;height:320px;display:block}
.ax{font-family:'Courier New',Courier,monospace;font-size:12px;fill:var(--text3)}
.legend{float:right;font-size:12px;color:var(--text3);letter-spacing:.05em}
.legend i{display:inline-block;width:22px;height:0;vertical-align:middle;margin:0 6px 0 14px}
.sw-level{border-top:2px solid var(--amber)}
.sw-avg{border-top:2px dashed var(--text3)}
.band{fill:var(--text3);fill-opacity:var(--band-op);stroke:none}
body.light{--band-op:.14}
body.dark{--band-op:.35}
.legend i.sw-band{height:10px;width:16px;background:var(--text3);opacity:calc(var(--band-op) * 2)}
.fwdbg{fill:var(--bg2)}
.hl{font-family:'Courier New',Courier,monospace;font-size:13px;font-weight:800;fill:var(--text)}
.tfs{margin-left:18px}
.tf{padding:3px 10px;margin-right:2px;background:none;border:1px solid var(--border2);color:var(--text3);cursor:pointer;font-family:inherit;font-size:12px;font-weight:700;letter-spacing:.06em}
.tf.on{background:var(--amber);border-color:var(--amber);color:#000}
.tip{position:absolute;top:14px;display:none;pointer-events:none;background:var(--bg1);border:1px solid var(--border2);border-left:3px solid var(--amber);padding:6px 10px;font-size:12px;color:var(--text2);white-space:nowrap;line-height:1.5}
.tip b{color:var(--text)}
.page-footnote{font-size:11px;color:var(--text3);line-height:1.6;margin:28px 0 4px;padding-top:14px;border-top:1px solid var(--border2)}
.page-footnote ul{margin:0;padding-left:16px}
.page-footnote li{margin:2px 0}
.page-footnote b{color:var(--text2)}
.banner{padding:10px 14px;margin-bottom:18px;border:1px solid var(--red);color:var(--red);font-size:14px;font-weight:700;letter-spacing:.04em;white-space:normal;overflow-wrap:anywhere}
.meta{white-space:normal}
.name{white-space:nowrap}
.series-link{margin-left:8px;color:var(--amber);font-size:12px;font-weight:800;letter-spacing:.04em;text-decoration:underline;text-underline-offset:2px}
.series-link:hover{color:var(--text)}
.sub{display:block;max-width:520px;margin-top:2px;font-size:12px;font-weight:600;letter-spacing:.02em;color:var(--text3);white-space:normal}
.err{display:block;max-width:640px;margin-top:3px;font-size:12px;font-weight:800;color:var(--red);white-space:normal;overflow-wrap:anywhere}
.page-footnote a{color:var(--text2)}
</style>
</head>
<body class="light">
<div id="page-tabs"></div>
<div class="topbar"><h1>U.S. Energy Stockpiles</h1><div class="meta" id="meta">Loading...</div></div>
<div class="root" id="root"></div>

<script src="scripts/release-calendar.js"></script>
<script>
const STALE_DAYS = { W:14, M:125 };
let DATA = null, theme = "light", selected = "crude_stocks";

const fmt = (v, d) => v == null ? "—" :
  v.toLocaleString("en-US", { minimumFractionDigits:d, maximumFractionDigits:d });
const signed = (v, d) => {
  if (v == null) return "—";
  const r = Math.round(v * 10 ** d) / 10 ** d || 0; // avoid "-0.0"
  return (r > 0 ? "+" : "") + fmt(r, d);
};
const SOURCE = {
  "PET.WCESTUS1.W": "https://www.eia.gov/dnav/pet/hist/LeafHandler.ashx?n=PET&s=WCESTUS1&f=W",
  "PET.W_EPC0_SAX_YCUOK_MBBL.W": "https://www.eia.gov/dnav/pet/hist/LeafHandler.ashx?n=PET&s=W_EPC0_SAX_YCUOK_MBBL&f=W",
  "PET.WGTSTUS1.W": "https://www.eia.gov/dnav/pet/hist/LeafHandler.ashx?n=PET&s=WGTSTUS1&f=W",
  "PET.WDISTUS1.W": "https://www.eia.gov/dnav/pet/hist/LeafHandler.ashx?n=PET&s=WDISTUS1&f=W",
  "NG.NW2_EPG0_SWO_R48_BCF.W": "https://www.eia.gov/dnav/ng/hist/nw2_epg0_swo_r48_bcfw.htm"
};
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({
  "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
}[c]));
function safeEiaUrl(u) {
  try {
    const url = new URL(u);
    if (url.protocol !== "https:") return "";
    if (!/^(?:www\.|ir\.)?eia\.gov$/.test(url.hostname)) return "";
    return url.href;
  } catch (e) {
    return "";
  }
}
function sourceUrl(s) {
  return safeEiaUrl((s && (s.source_url || SOURCE[s.series_id])) || "");
}
function fmtInstant(iso) {
  if (!iso) return "not available";
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return "not available";
  const g = {};
  new Intl.DateTimeFormat("en-US", {
    timeZone: "America/New_York",
    month: "short", day: "numeric", year: "numeric",
    hour: "numeric", minute: "2-digit", hour12: true
  }).formatToParts(d).forEach(p => { if (p.type !== "literal") g[p.type] = p.value; });
  const mer = /p/i.test(g.dayPeriod || "") ? "p.m." : "a.m.";
  return `${g.month} ${g.day}, ${g.year}, ${g.hour}:${g.minute} ${mer} ET`;
}
function nextPetroleumText() {
  return typeof EIARelease === "undefined" ? "not available" : EIARelease.nextPetroleum(new Date());
}
function nextGasText() {
  return typeof EIARelease === "undefined" ? "not available" : EIARelease.nextGas(new Date());
}
function latestSuccess(data) {
  let best = null;
  (data.series || []).forEach(s => {
    if (!s || !s.checked_at) return;
    const t = Date.parse(s.checked_at);
    if (!Number.isNaN(t) && (best == null || t > best)) best = t;
  });
  return best == null ? "not available" : fmtInstant(new Date(best).toISOString());
}
function metaLine(data) {
  const attempt = data.generated_at ? fmtInstant(data.generated_at) : "not available";
  return `Last fetch attempt: ${attempt} · Last successful ingestion: ${latestSuccess(data)}`;
}
const ageDays = iso => (Date.now() - new Date(iso + "T00:00:00Z")) / 864e5;
const isBad = s => !s || !s.ok || !s.period || ageDays(s.period) > STALE_DAYS[s.freq];
const asOf = s => {
  if (!s || !s.period) return "NO DATA";
  const d = new Date(s.period + "T00:00:00Z");
  const t = s.freq === "M"
    ? d.toLocaleDateString("en-US", { month:"short", year:"numeric", timeZone:"UTC" })
    : "Wk " + d.toLocaleDateString("en-US", { month:"short", day:"2-digit", timeZone:"UTC" });
  return t + (!s.ok ? " · LAST GOOD" : isBad(s) ? " · STALE" : "");
};

function row(name, s, i) {
  s = s || {};
  const chg = s.freq === "M" ? "m/m" : "w/w";
  const sel = s.key === selected ? " row-sel" : "";
  const key = /^[A-Za-z0-9_]+$/.test(s.key || "") ? s.key : "";
  const url = sourceUrl(s);
  const link = url
    ? ` <a class="series-link" href="${esc(url)}" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()">EIA source</a>`
    : `<span class="sub">EIA source: not available</span>`;
  const err = s.ok === false
    ? `<div class="err">Fetch error: ${esc(s.error || "not available")}</div>` : "";
  return `<tr class="${i % 2 ? "row-alt" : ""}${sel}" style="cursor:pointer" onclick="selected='${key}';render()" title="Click to chart">
    <td><span class="name">${esc(name)}</span>${link}
      <div class="sub">Last successful ingestion: ${esc(fmtInstant(s.checked_at))}</div>${err}</td>
    <td class="unit">${esc(s.unit || "")}</td>
    <td class="latest">${fmt(s.value, s.decimals)}</td>
    <td>${signed(s.change, s.decimals)} <span style="color:var(--text3);font-size:12px">${chg}</span></td>
    <td class="prior">${fmt(s.avg5, s.decimals)}</td>
    <td>${signed(s.vs_avg5, s.decimals)}</td>
    <td>${s.vs_avg5_pct == null ? "—" : signed(s.vs_avg5_pct, 1) + "%"}</td>
    <td class="${isBad(s) ? "stale" : "prior"}">${asOf(s)}</td></tr>`;
}

function render() {
  document.getElementById("page-tabs").innerHTML =
    `<button class="page-tab active">ENERGY STOCKPILES</button><div class="theme">${["dark","light"].map(m =>
      `<button class="${m === theme ? "active" : ""}" onclick="setTheme('${m}')">${m}</button>`).join("")}</div>`;
  if (!DATA) return;
  const runAge = (Date.now() - new Date(DATA.generated_at)) / 864e5;
  let html = runAge > 4 ? `<div class="banner">UPDATE JOB LAST RAN ${Math.floor(runAge)} DAYS AGO — CHECK GITHUB ACTIONS</div>` : "";
  const failed = DATA.series.filter(s => s && s.ok === false);
  if (failed.length) html += `<div class="banner">FETCH ERROR — ${failed.map(s =>
    `${esc(s.label || s.key || "series")}: ${esc(s.error || "not available")}`).join(" · ")}</div>`;
  const body = DATA.series.map((s, i) => row(s.label, s, i)).join("");
  html += `<div class="panel"><div class="tbl-wrap"><table class="bal-table"><thead><tr>
    <th>ITEM</th><th style="text-align:left">UNIT</th><th class="latest">LATEST</th><th>CHANGE</th>
    <th>5-YR AVG</th><th>VS 5-YR</th><th>VS 5-YR %</th><th>AS OF</th></tr></thead>
    <tbody>${body}</tbody></table></div></div>`;
  html += chartPanel(DATA.series.find(s => s.key === selected) || DATA.series[0]);
  html += `<div class="page-footnote"><ul>
    <li>Next releases: <b>Petroleum ${esc(nextPetroleumText())}</b> · <b>Gas storage ${esc(nextGasText())}</b>. Holiday times come from the <a href="https://www.eia.gov/petroleum/supply/weekly/schedule.php" target="_blank" rel="noopener noreferrer">Weekly Petroleum Status Report schedule</a> and the <a href="https://ir.eia.gov/ngs/schedule.html" target="_blank" rel="noopener noreferrer">Weekly Natural Gas Storage Report schedule</a>. A shift EIA has not published yet shows as not available.</li>
    <li>Crude commercial stocks exclude the SPR. Gasoline = total motor gasoline. Distillates = ULSD / heating oil. NatGas = working gas in storage.</li>
    <li>5-yr avg and range = same week in each of the prior 5 years. The shaded area on the right shows the next ~3 months of that 5-yr pattern (history only, no estimate). H / L = high and low in the selected window.</li>
    <li>Click a row to chart it. Last successful ingestion is the last time that series was fetched and accepted. A fetch error is shown on the row. Red AS OF means the period is out of date or the last fetch failed.</li>
    <li>Source: U.S. Energy Information Administration. Each series links to its page on eia.gov.</li></ul></div>`;
  document.getElementById("root").innerHTML = html;
  wireChart();
}

// ---- Chart: selected stockpile vs its 5-yr avg/range, with the 5-yr pattern continued ahead ----
const CW = 1250, CH = 320, M = { l:70, r:20, t:26, b:30 };
let CHART = null, years = 1;

function chartPanel(s) {
  const all = (s.history || []).map(([d, v, a, mn, mx]) => ({ d:new Date(d + "T00:00:00Z"), v, a, mn, mx }));
  const h = all.slice(-(years * 52 + 1));
  const f = (s.forward || []).map(([d, a, mn, mx]) => ({ d:new Date(d + "T00:00:00Z"), a, mn, mx }));
  if (h.length < 2) return "";
  const last = h[h.length - 1];
  const vals = [...h, ...f].flatMap(p => [p.v, p.a, p.mn, p.mx].filter(v => v != null));
  let lo = Math.min(...vals), hi = Math.max(...vals);
  const pad = (hi - lo) * 0.08 || 1; lo -= pad; hi += pad;
  const t0 = h[0].d, t1 = f.length ? f[f.length - 1].d : last.d;
  const x = d => M.l + (d - t0) / (t1 - t0) * (CW - M.l - M.r);
  const y = v => M.t + (hi - v) / (hi - lo) * (CH - M.t - M.b);
  const P = (d, v) => `${x(d).toFixed(1)},${y(v).toFixed(1)}`;
  const line = (pts, key) => pts.filter(p => p[key] != null).map((p, i) => (i ? "L" : "M") + P(p.d, p[key])).join("");
  const area = (pts, k1, k2) => {
    const q = pts.filter(p => p[k1] != null && p[k2] != null);
    return q.length < 2 ? "" : q.map(p => P(p.d, p[k2])).join(" ") + " " + q.slice().reverse().map(p => P(p.d, p[k1])).join(" ");
  };
  // 5-yr band/avg run through history and on into the forward window
  const ctx = [...h, ...f];
  const band = area(ctx, "mn", "mx");

  // y grid
  const raw = (hi - lo) / 5, mag = 10 ** Math.floor(Math.log10(raw));
  const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(st => st >= raw);
  let grid = "";
  for (let v = Math.ceil(lo / step) * step; v <= hi; v += step)
    grid += `<line x1="${M.l}" x2="${CW - M.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--border)" />
      <text x="${M.l - 8}" y="${y(v) + 4}" text-anchor="end" class="ax">${fmt(v, step < 1 ? 1 : 0)}</text>`;
  // x ticks: quarterly for 1-2y, yearly for 5y
  const months = years >= 5 ? [0] : [0, 3, 6, 9], MN = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  for (let yr = t0.getUTCFullYear(); yr <= t1.getUTCFullYear(); yr++)
    for (const mo of months) {
      const d = new Date(Date.UTC(yr, mo, 1));
      if (d < t0 || d > t1) continue;
      grid += `<line x1="${x(d)}" x2="${x(d)}" y1="${CH - M.b}" y2="${CH - M.b + 5}" stroke="var(--border2)" />
        <text x="${x(d)}" y="${CH - 8}" text-anchor="middle" class="ax">${years >= 5 ? yr : MN[mo] + " " + String(yr).slice(2)}</text>`;
    }
  // high / low of the level in the visible window
  let hp = h[0], lp = h[0];
  for (const p of h) { if (p.v > hp.v) hp = p; if (p.v < lp.v) lp = p; }
  const mark = (p, kind) => {
    const px = x(p.d), py = y(p.v), up = kind === "H";
    const anchor = px > CW - 160 ? "end" : px < M.l + 90 ? "start" : "middle";
    return `<circle cx="${px}" cy="${py}" r="4" fill="var(--bg)" stroke="var(--text)" stroke-width="2" />
      <text x="${px}" y="${up ? py - 10 : py + 18}" text-anchor="${anchor}" class="hl">${kind} ${fmt(p.v, s.decimals)}
      <tspan class="ax"> ${p.d.toLocaleDateString("en-US", { month:"short", day:"numeric", year:"2-digit", timeZone:"UTC" })}</tspan></text>`;
  };
  const xNow = x(last.d);
  CHART = { s, pts:[...h.map(p => ({ ...p, kind:"act" })), ...f.map(p => ({ ...p, kind:"fwd" }))], x, y };
  const btns = [1, 2, 5].map(n => `<button class="tf${n === years ? " on" : ""}" onclick="years=${n};render()">${n}Y</button>`).join("");
  return `<div class="panel"><div class="panel-hdr"><span class="panel-title">${s.label}</span>
      <span class="panel-sub">${s.unit}</span><span class="tfs">${btns}</span>
      <span class="legend"><i class="sw-level"></i>Level <i class="sw-avg"></i>5-yr avg <i class="sw-band"></i>5-yr range
</span></div>
    <div class="chart-wrap">
      <svg viewBox="0 0 ${CW} ${CH}" id="chart" preserveAspectRatio="none">
        ${f.length ? `<rect x="${xNow}" y="${M.t}" width="${CW - M.r - xNow}" height="${CH - M.t - M.b}" class="fwdbg" />
          <text x="${xNow + 6}" y="${M.t - 8}" class="ax">5-YR PATTERN AHEAD →</text>` : ""}
        ${grid}
        <line x1="${M.l}" x2="${CW - M.r}" y1="${CH - M.b}" y2="${CH - M.b}" stroke="var(--border2)" />
        ${band ? `<polygon points="${band}" class="band" />` : ""}
        <path d="${line(ctx, "a")}" fill="none" stroke="var(--text3)" stroke-width="2" stroke-dasharray="6 4" vector-effect="non-scaling-stroke" />
        <path d="${line(h, "v")}" fill="none" stroke="var(--amber)" stroke-width="2" vector-effect="non-scaling-stroke" />
        ${f.length ? `<line x1="${xNow}" x2="${xNow}" y1="${M.t}" y2="${CH - M.b}" stroke="var(--border2)" vector-effect="non-scaling-stroke" />` : ""}
        ${mark(hp, "H")}${mark(lp, "L")}
        <line id="xhair" y1="${M.t}" y2="${CH - M.b}" stroke="var(--text3)" stroke-width="1" visibility="hidden" vector-effect="non-scaling-stroke" />
        <circle id="dot" r="4" fill="var(--amber)" stroke="var(--bg)" stroke-width="2" visibility="hidden" />
      </svg>
      <div class="tip" id="tip"></div>
    </div></div>`;
}

function wireChart() {
  const svg = document.getElementById("chart");
  if (!svg || !CHART) return;
  const { s, pts, x, y } = CHART, tip = document.getElementById("tip"),
        xh = document.getElementById("xhair"), dot = document.getElementById("dot"), d = s.decimals;
  svg.addEventListener("mousemove", e => {
    const r = svg.getBoundingClientRect(), mx = (e.clientX - r.left) / r.width * CW;
    let b = pts[0];
    for (const p of pts) if (Math.abs(x(p.d) - mx) < Math.abs(x(b.d) - mx)) b = p;
    const px = x(b.d), val = b.kind === "act" ? b.v : b.a;
    xh.setAttribute("x1", px); xh.setAttribute("x2", px); xh.setAttribute("visibility", "visible");
    dot.setAttribute("cx", px); dot.setAttribute("cy", y(val)); dot.setAttribute("visibility", "visible");
    dot.setAttribute("fill", b.kind === "act" ? "var(--amber)" : "var(--text3)");
    const wk = "Wk " + b.d.toLocaleDateString("en-US", { month:"short", day:"2-digit", year:"numeric", timeZone:"UTC" });
    const rng = b.mn == null ? "—" : `${fmt(b.mn, d)}–${fmt(b.mx, d)}`;
    tip.innerHTML = b.kind === "act"
      ? `<b>${wk}</b><br>Level&nbsp;&nbsp;&nbsp;${fmt(b.v, d)} ${s.unit}<br>5-yr avg ${fmt(b.a, d)}<br>5-yr rng ${rng}<br>vs 5-yr&nbsp; ${signed(b.a == null ? null : b.v - b.a, d)}`
      : `<b>${wk} · 5-YR PATTERN</b><br>5-yr avg ${fmt(b.a, d)} ${s.unit}<br>5-yr rng ${rng}`;
    const left = px / CW * r.width;
    tip.style.left = (left > r.width - 220 ? left - 210 : left + 12) + "px";
    tip.style.display = "block";
  });
  svg.addEventListener("mouseleave", () => {
    tip.style.display = "none"; xh.setAttribute("visibility", "hidden"); dot.setAttribute("visibility", "hidden");
  });
}

function setTheme(m) {
  theme = m;
  document.body.classList.toggle("dark", m === "dark");
  document.body.classList.toggle("light", m === "light");
  render();
}

render();
fetch("data/energy.json", { cache:"no-store" })
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(d => {
    DATA = d;
    document.getElementById("meta").textContent = metaLine(d);
    render();
  })
  .catch(() => {
    document.getElementById("meta").textContent = "No data";
    document.getElementById("root").innerHTML =
      `<div class="banner">NO DATA YET — RUN THE "UPDATE DATA" WORKFLOW IN GITHUB ACTIONS</div>`;
  });
</script>
</body>
