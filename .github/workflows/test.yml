name: Test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  calendar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Release calendar
        run: node scripts/test-release-calendar.js

      - name: Fetch script syntax
        run: python3 -m py_compile scripts/fetch.py
