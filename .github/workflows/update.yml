name: Update data
 
on:
  schedule:
    # Weekdays, after the Eastern release clock. 15:45 UTC is 10:45 a.m. EST /
    # 11:45 a.m. EDT (after 10:30 a.m.). 20:45 UTC is 3:45 p.m. EST / 4:45 p.m. EDT
    # (after a noon holiday release). 22:15 UTC is 5:15 p.m. EST / 6:15 p.m. EDT,
    # so a published 5:00 p.m. ET holiday release is still picked up the same day.
    - cron: "45 15 * * 1-5"
    - cron: "45 20 * * 1-5"
    - cron: "15 22 * * 1-5"
  workflow_dispatch:
 
permissions:
  contents: write
 
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
 
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
 
      - name: Fetch EIA data
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: python scripts/fetch.py || echo "FETCH_FAILED=1" >> "$GITHUB_ENV"
 
      - name: Commit if changed
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          if [ -f data/energy.json ]; then
            git add data/energy.json
            if ! git diff --cached --quiet; then
              git commit -m "data: $(date -u +%Y-%m-%dT%H:%MZ)"
              git push origin HEAD
            fi
          fi
 
      - name: Flag failures
        if: env.FETCH_FAILED == '1'
        run: |
          echo "One or more series failed validation or fetch. Last good data was kept."
          exit 1
 
